[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-rewards"
version = "0.1.0"
description = "Lern-Belohnungen in CS2-Skins einlösen, mit harten Budgetlimits"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "brotli>=1.1",  # Skinport liefert /v1/items nur Brotli-komprimiert
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
reward = "cs2_rewards.cli:main"

[tool.setuptools.packages.find]
include = ["cs2_rewards*"]
